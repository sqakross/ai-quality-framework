
name: AI Quality Tests

on:
  push:
  pull_request:

jobs:
  quality-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx openai

      - name: Run quality gate tests
        run: |
          python -m pytest tests/test_regression.py tests/test_quality_gate.py tests/test_quality_pipeline.py -v
